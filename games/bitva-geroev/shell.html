<title>Битва героев</title>

<style>

.pix { image-rendering: pixelated; }

.top { display: flex; align-items: center; gap: 8px; }

.mbox { background: var(--card); border-radius: 20px; padding: 16px; width: 100%; max-width: 400px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; }

.mbox h2 { margin: 0; font-size: 20px; }
.rew { display: flex; justify-content: center; gap: 18px; font-size: 22px; font-weight: 800; }
.rchest { display: flex; flex-direction: column; align-items: center; font-weight: 700; }
.newlg { background: var(--c); color: #fff; border-radius: 12px; padding: 8px; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
.hint { color: var(--muted); }
.sbtns { display: flex; flex-direction: column; gap: 8px; }
.shead { display: flex; gap: 12px; align-items: center; text-align: left; } .shead img.big { width: 112px; height: 104px; background: radial-gradient(#fff, #e8f0fa); border: 3px solid var(--r); border-radius: 16px; }
.rar { font-weight: 700; }

.abil { background: #fff8d0; border-radius: 12px; padding: 8px; text-align: left; }
.repl .row { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.cards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.cardgot { position: relative; width: 100px; background: #f2f6fc; border-top: 5px solid var(--r); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; font-size: 12px; } .cardgot img { width: 60px; height: 56px; }
.new { position: absolute; top: -10px; background: #ff4a6a; color: #fff; border-radius: 8px; padding: 1px 6px; font-weight: 800; }
#battle { position: fixed; inset: 0; background: #2a3a5a; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; }
.bhead { width: 100%; max-width: 600px; display: flex; justify-content: space-between; color: #fff; gap: 8px; }
.bhead > div { display: flex; flex-direction: column; } .bhead small { opacity: 0.8; } #bfoe { text-align: right; } .vs { font-weight: 800; font-size: 20px; color: #ffd02a; align-self: center; }
#bcv { width: 100%; max-width: 600px; aspect-ratio: 4/3; border-radius: 14px; image-rendering: pixelated; }
.bfoot { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; color: #c8d8f0; font-size: 12px; gap: 8px; }
#toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 12px; padding: 8px 14px; z-index: 20; font-weight: 500; pointer-events: none; max-width: 92vw; text-align: center; }
.tabs button { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; font-size: 12px; } .tabs i { font-style: normal; font-size: 20px; line-height: 1.1; }
.wtop { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.9); border-radius: 14px; padding: 6px 6px 6px 12px; font-size: 16px; } .wtop small { color: var(--muted); font-size: 12px; }
.wwrap { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; }
#wboard { border-radius: 14px; touch-action: none; box-shadow: 0 3px 0 rgba(36,48,74,0.15); }
#winfo { display: flex; align-items: center; gap: 10px; min-height: 64px; } #winfo img { width: 40px; height: 40px; } #winfo span { flex: 1; } #winfo small { color: var(--muted); }

#quests > b { font-size: 15px; }

#worders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.word { min-width: 0; overflow: hidden; position: relative; background: #fff; border: 0; border-left: 5px solid var(--r); border-radius: 12px; box-shadow: 0 3px 0 rgba(36,48,74,0.12); padding: 4px; display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; align-items: center; gap: 0 4px; text-align: left; font-size: 11px; }
.word .wh { width: 34px; height: 32px; grid-row: span 2; } .wwant { display: flex; align-items: center; gap: 2px; } .wwant img { width: 26px; height: 26px; } .wwant small { font-size: 10px; line-height: 1.1; color: var(--muted); }
.wrew { font-weight: 700; font-size: 11px; line-height: 1.2; } .word.ok { background: #e4fbe4; box-shadow: 0 0 0 3px var(--green); }
.wbtns { display: flex; flex-direction: column; gap: 4px; } .wbtns .btn { padding: 5px 10px; font-size: 13px; }
.eqgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; } .eq { background: #f2f6fc; border: 0; border-top: 5px solid var(--r); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; font-size: 12px; } .eq img { width: 52px; height: 48px; } .eq.inteam { outline: 3px solid var(--blue); } .eq em { color: var(--greenD); font-style: normal; font-weight: 800; } .eq span { color: var(--muted); }
.gear { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 2px; } .gear img { width: 22px; height: 22px; background: #fff8d0; border-radius: 6px; }
.gearrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: left; font-size: 12px; } .gearrow > div { display: flex; align-items: center; gap: 6px; background: #f2f6fc; border-radius: 10px; padding: 6px; } .gearrow img { width: 32px; height: 32px; }

</style>
