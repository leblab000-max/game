<title>Котапульта</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: #5ec4ff; color: #24304a; font-family: Rubik, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; color-scheme: light; }
#cv { position: fixed; inset: 0; display: block; touch-action: none; }
.btn { border: 0; border-bottom: 5px solid #c4d4ea; border-radius: 16px; padding: 12px 18px; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #24304a; background: #fff; }
.btn small { font-weight: 500; font-size: 13px; }
.btn.orange { background: linear-gradient(#ffb04a, #ff9a2a); border-bottom-color: #d8701a; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.2); }
.btn.green { background: linear-gradient(#6ad878, #4cc85a); border-bottom-color: #2f9a3e; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.2); }
.btn:active { transform: translateY(2px); border-bottom-width: 3px; }
.ibtn { background: rgba(255,255,255,0.9); border: 0; border-bottom: 4px solid #c4d4ea; border-radius: 14px; min-width: 46px; height: 46px; font-size: 22px; cursor: pointer; font-family: inherit; color: #24304a; }
.over { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; z-index: 2; }
.logo { font-size: clamp(44px, 11vw, 96px); font-weight: 800; color: #ff9a2a; text-shadow: 0 5px 0 #b8580a, 0 8px 18px rgba(0,0,0,0.25); margin: 0; letter-spacing: 1px; }
.sub { font-size: 18px; font-weight: 500; color: #1b3a6a; margin-top: -8px; text-align: center; }
.pill { background: rgba(255,255,255,0.9); border-radius: 20px; padding: 6px 14px; font-weight: 800; }
#lvlScr { justify-content: flex-start; padding-top: 14px; overflow-y: auto; }
.lvTop { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 640px; } .lvTop h2 { flex: 1; margin: 0; text-align: center; color: #fff; text-shadow: 0 2px 0 #1b3a6a; font-size: 26px; }
#lvlGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
.lv { aspect-ratio: 1; border: 0; border-bottom: 6px solid #b86e00; border-radius: 18px; background: linear-gradient(#ffd060, #ffb020); color: #5a3000; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
.lv b { font-size: 28px; } .lv span { color: #fff; text-shadow: 0 1px 0 #b86e00; font-size: 15px; letter-spacing: 1px; }
.lv.locked { background: rgba(255,255,255,0.5); border-bottom-color: rgba(0,0,0,0.15); color: #6a7898; }
#hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 8px; z-index: 2; pointer-events: none; }
#hud > * { pointer-events: auto; } #hud .grow { flex: 1; text-align: center; pointer-events: none; }
#hLvl { font-weight: 700; color: #fff; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); } #hScore { font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #1b3a6a, 0 0 8px rgba(0,0,0,0.2); }
#tip { position: fixed; left: 50%; top: 66px; transform: translateX(-50%); background: rgba(27,58,106,0.85); color: #fff; border-radius: 12px; padding: 8px 14px; font-weight: 500; z-index: 2; text-align: center; max-width: 92vw; pointer-events: none; }
.modal { position: fixed; inset: 0; background: rgba(10,20,50,0.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.mbox { background: #fff; border-radius: 22px; padding: 18px; width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow: auto; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(0.85); opacity: 0; } }
.mbox h1 { margin: 0; font-size: 24px; } .big { font-size: 40px; font-weight: 800; color: #ff9a2a; } .hint { color: #6a7898; } .btns { display: flex; flex-direction: column; gap: 8px; }
.stars { font-size: 54px; letter-spacing: 6px; } .stars span { color: #d6dcea; display: inline-block; } .stars span.on { color: #ffc020; animation: star .4s ease-out both; text-shadow: 0 3px 0 #b86e00; }
@keyframes star { from { transform: scale(2) rotate(-30deg); opacity: 0; } }
#rotate { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(27,58,106,0.8); color: #fff; padding: 6px 12px; border-radius: 12px; font-size: 13px; z-index: 3; pointer-events: none; white-space: nowrap; }
#story { background: rgba(10,20,50,0.55); align-items: flex-end; padding-bottom: 24px; }
.sbox { display: flex; align-items: flex-end; gap: 12px; width: 100%; max-width: 720px; background: none; border: 0; cursor: pointer; font-family: inherit; text-align: left; padding: 0; }
.sbox.r { flex-direction: row-reverse; text-align: right; }
.sbox img { width: min(30vw, 170px); height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); animation: pop .25s ease-out; }
.say { flex: 1; background: #fff; border: 4px solid #1b2550; border-radius: 22px; padding: 12px 18px; box-shadow: 0 6px 0 rgba(0,0,0,0.25); animation: pop .2s ease-out; }
.say b { color: #d8701a; font-size: 18px; } .say p { margin: 4px 0; font-size: clamp(16px, 2.6vw, 22px); color: #1b2550; font-weight: 500; } .say small { color: #8a96b0; }
.skip { position: fixed; top: 12px; right: 12px; background: rgba(255,255,255,0.85); border: 0; border-radius: 12px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
#chap { position: fixed; top: 18%; left: 0; right: 0; text-align: center; font-size: clamp(26px, 5vw, 44px); font-weight: 800; color: #fff; text-shadow: 0 3px 0 #1b2550, 0 0 20px rgba(0,0,0,0.4); z-index: 11; pointer-events: none; }
#lvlGrid h3.ch { grid-column: 1 / -1; margin: 10px 0 0; color: #fff; text-shadow: 0 2px 0 #1b3a6a; }
.lv.dusk { background: linear-gradient(#ffb080, #ff7a4a); border-bottom-color: #b84a20; color: #5a1a00; } .lv.winter { background: linear-gradient(#e8f4ff, #9ad0f4); border-bottom-color: #5a90c0; color: #1a3a6a; } .lv.night { background: linear-gradient(#8a7ae0, #5a4ab0); border-bottom-color: #2a1a70; color: #fff; }
.lv.locked { background: rgba(255,255,255,0.5) !important; border-bottom-color: rgba(0,0,0,0.15) !important; color: #6a7898 !important; }
#toast { position: fixed; left: 50%; top: 110px; transform: translateX(-50%); background: #24304a; color: #fff; border-radius: 12px; padding: 8px 14px; z-index: 20; pointer-events: none; }
</style>
<canvas id="cv"></canvas>
<div class="over" id="menuScr"><h1 class="logo">КОТАПУЛЬТА</h1><div class="sub">Мыши украли рыбу. Пора на штурм!</div><span class="pill" id="mStars">★ 0</span><button class="btn orange" id="mPlay" style="font-size:26px;padding:16px 46px">Играть</button><button class="ibtn" id="mSound" style="padding:0 16px;font-size:16px"></button></div>
<div class="over" id="lvlScr" hidden><div class="lvTop"><button class="ibtn" id="lvlBack" aria-label="Назад">←</button><h2>Уровни</h2><span class="pill" id="lvlStars"></span></div><div id="lvlGrid"></div></div>
<div id="hud" hidden><button class="ibtn" id="hBack" aria-label="К уровням">☰</button><button class="ibtn" id="hRetry" aria-label="Заново">↻</button><div class="grow"><div id="hLvl"></div><div id="hScore">0</div></div><button class="ibtn" id="hSound" aria-label="Звук">🔊</button></div>
<div id="tip" hidden></div>
<div class="modal" id="win" hidden><div class="mbox" id="winBody"></div></div>
<div id="rotate" hidden>Удобнее играть, повернув телефон боком</div>
<div id="chap" hidden></div>
<div class="modal" id="story" hidden><button class="sbox" id="storyBody"></button><button class="skip" id="skip">Пропустить ›</button></div>
<div id="toast" hidden></div>
